<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Telegram Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Bar Info -->
    <div class="top-bar">
        <div>Stake: <span id="play-stake">10 ETB</span></div>
        <div>Main Wallet: <span id="top-main-wallet">100</span></div>
        <div>Play Wallet: <span id="top-play-wallet">50</span></div>
        <div class="timer">Timer: <span id="countdown">49</span>s</div>
    </div>

    <!-- Main Content Area -->
    <div id="main-content" class="content-section">
        <!-- Game Screen (Default) -->
        <div id="game-route" class="route active">
            <h3>ካርቴላ ይምረጡ (1 - 600)</h3>
            <div class="cartela-container" id="cartela-grid">
                <!-- JavaScript 1 - 600 ካርቴላዎችን እዚህ ይጨምራል -->
            </div>
            
            <h3>የእርስዎ 5x5 ካርቴላ</h3>
            <div class="bingo-card" id="my-bingo-card">
                <!-- የተመረጠው 5x5 እዚህ ይሰራራል -->
            </div>
        </div>

        <!-- Wallet Route -->
        <div id="wallet-route" class="route">
            <h3>የኪስ ቦርሳ (Wallet)</h3>
            <p>Main Wallet: <span id="wallet-main">100</span></p>
            <p>Play Wallet: <span id="wallet-play">50</span></p>
        </div>

        <!-- History Route -->
        <div id="history-route" class="route">
            <h3>የተጫወቱት ጨዋታዎች ታሪክ</h3>
            <ul id="history-list">
                <li>Game #0001 - Lost</li>
            </ul>
        </div>

        <!-- Profile Route -->
        <div id="profile-route" class="route">
            <h3>የግል መገለጫ (Profile)</h3>
            <p>Telegram ID: <span id="prof-id">12345678</span></p>
            <p>Telephone: <span id="prof-phone">+2519...</span></p>
            <p>Main Wallet: <span id="prof-main">100</span></p>
            <p>Play Wallet: <span id="prof-play">50</span></p>
        </div>
    </div>

    <!-- Navigation Bar -->
    <nav class="nav-bar">
        <button onclick="switchRoute('game-route')">Game</button>
        <button onclick="switchRoute('wallet-route')">Wallet</button>
        <button onclick="switchRoute('history-route')">History</button>
        <button onclick="switchRoute('profile-route')">Profile</button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
