<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edil Bingo</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; margin: 0; padding: 0; text-align: center; }
        .hidden { display: none !important; }
        
        /* 1ኛው ገጽ፡ የመምረጫ ገጽ */
        .top-bar { display: flex; justify-content: space-around; background: #222; padding: 10px; font-size: 14px; }
        .timer { color: #ff4757; font-weight: bold; }
        .cartela-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; height: 250px; overflow-y: scroll; padding: 10px; background: #1a1a1a; }
        .cartela { background: #333; padding: 12px; border-radius: 4px; cursor: pointer; }
        .cartela.selected { background: #2ed573; color: black; font-weight: bold; }
        
        /* 2ኛው ገጽ፡ የቢንጎ መጫወቻ የቀጥታ ገጽ */
        .live-game-page { padding: 15px; }
        .live-top-bar { display: flex; justify-content: space-between; background: #2ed573; color: black; padding: 12px; font-weight: bold; border-radius: 8px; font-size: 14px; margin-bottom: 15px; }
        
        .live-screen-container { margin: 20px 0; }
        .small-live-screen { width: 110px; height: 110px; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; box-shadow: 0 0 15px rgba(255,255,255,0.2); transition: background 0.3s ease; }
        
        .bingo-board { display: flex; justify-content: space-around; background: #1a1a1a; padding: 10px; border-radius: 8px; }
        .column { width: 18%; }
        .column h3 { margin: 5px 0; font-size: 20px; color: #ffa502; border-bottom: 2px solid #ffa502; }
        .column div { display: flex; flex-direction: column; gap: 4px; }
        .column div span { background: #2d3436; padding: 6px; font-size: 14px; border-radius: 3px; color: #b2bec3; }
        
        .column div span.called-highlight { background: #2ed573; color: black; font-weight: bold; transform: scale(1.05); box-shadow: 0 0 8px #2ed573; }
    </style>
</head>
<body>

    <!-- ================= 1ኛው ገጽ፡ የመምረጫ ስክሪን ================= -->
    <div id="selection-page">
        <div class="top-bar">
            <div>Stake: <span>10 ETB</span></div>
            <div>Main Wallet: <span>150</span></div>
            <div>Play Wallet: <span>50</span></div>
            <div class="timer">Timer: <span id="countdown">49</span>s</div>
        </div>
        <h2>ካርቴላ ይምረጡ (1 - 600)</h2>
        <div class="cartela-grid" id="grid-container"></div>
    </div>

    <!-- ================= 2ኛው ገጽ፡ የቀጥታ ጨዋታ ስክሪን ================= -->
    <div id="live-game-page" class="live-game-page hidden">
        <div class="live-top-bar">
            <div>Game ID: <span id="lbl-game-id">0000</span></div>
            <div>Bet: <span id="lbl-bet">-</span></div>
            <div>ደራሽ: <span id="lbl-derash">-</span></div>
            <div>Called: <span id="lbl-called-count">0</span></div>
        </div>

        <div class="live-screen-container">
            <div id="live-ball-screen" class="small-live-screen" style="background-color: #ff4757;">-</div>
        </div>

        <div class="bingo-board">
            <div class="column"><h3>B</h3><div id="list-B"></div></div>
            <div class="column"><h3>I</h3><div id="list-I"></div></div>
            <div class="column"><h3>N</h3><div id="list-N"></div></div>
            <div class="column"><h3>G</h3><div id="list-G"></div></div>
            <div class="column"><h3>O</h3><div id="list-O"></div></div>
        </div>
    </div>

    <!-- የጃቫስክሪፕት ፋይሉን እዚህ ጋር እናገናኛለን -->
    <script src="app.js"></script>
</body>
</html>
