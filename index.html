<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>እድል ቢንጎ (Lucky Bingo)</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #121212; color: #fff; text-align: center; user-select: none; }
        #top-bar { display: flex; justify-content: space-between; background: #1e1e1e; padding: 12px 20px; font-weight: bold; border-bottom: 2px solid #333; }
        #timer-box { background: #ff4444; padding: 4px 12px; border-radius: 20px; }
        #main-content { padding: 15px; padding-bottom: 80px; }
        .screen { display: block; }
        .hidden { display: none !important; }
        .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-height: 300px; overflow-y: auto; background: #1a1a1a; padding: 10px; border-radius: 8px; }
        .cartela-btn { background: #2a2a2a; color: white; border: 1px solid #444; padding: 12px 0; font-weight: bold; cursor: pointer; border-radius: 6px; }
        .cartela-btn.selected { background: #ffcc00; color: black; box-shadow: 0 0 8px #ffcc00; }
        .bingo-card-box { background: #1e1e1e; border: 2px solid #ffcc00; border-radius: 10px; padding: 10px; margin-bottom: 15px; }
        .card-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .c-head { background: #ffcc00; color: black; font-weight: bold; padding: 6px 0; border-radius: 4px; }
        .cell { background: #2b2b2b; padding: 10px 0; font-weight: bold; border-radius: 4px; border: 1px solid #444; }
        .cell.marked { background: #4cd137; color: white; }
        #live-screen { background: #000; border: 2px solid #ffcc00; padding: 15px; font-size: 26px; font-weight: bold; color: #ffcc00; border-radius: 8px; margin-bottom: 15px; }
        .bingo-board { display: flex; justify-content: space-between; margin-top: 15px; }
        .col { width: 19%; background: #1e1e1e; border-radius: 6px; border: 1px solid #333; }
        .head { background: #333; color: #ffcc00; font-weight: bold; padding: 6px 0; }
        .num-list { font-size: 13px; padding: 8px 4px; min-height: 100px; color: #ccc; word-wrap: break-word; }
        #nav-bar { position: fixed; bottom: 0; width: 100%; display: flex; background: #1e1e1e; border-top: 2px solid #333; }
        .nav-btn { flex: 1; background: transparent; color: #aaa; border: none; padding: 15px 0; font-size: 14px; font-weight: bold; cursor: pointer; }
        .nav-btn.active { color: #ffcc00; border-top: 3px solid #ffcc00; padding-top: 12px; }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div id="top-bar">
        <div>Stake: <span style="color:#ffcc00;">10 ETB</span></div>
		<div>Stake: <span style="color:#ffcc00;">20 ETB</span></div>
        <div>Game ID: <span id="game-id-display">#0001</span></div>
        <div id="timer-box">Timer: <span id="timer">49</span>s</div>
    </div>

    <!-- MAIN CONTAINER -->
    <div id="main-content">
        <!-- 1-600 ስክሪን -->
        <div id="selection-screen" class="screen">
            <div id="cartela-grid" class="grid-container"></div>
        </div>

        <!-- ጨዋታ ስክሪን -->
        <div id="game-screen" class="screen hidden">
            <div id="live-screen">የተጠራ ቁጥር: <span id="called-number">-</span></div>
            <div id="my-bingo-cards"></div>
            <div class="bingo-board">
                <div class="col"><div class="head">B</div><div id="list-B" class="num-list"></div></div>
                <div class="col"><div class="head">I</div><div id="list-I" class="num-list"></div></div>
                <div class="col"><div class="head">N</div><div id="list-N" class="num-list"></div></div>
                <div class="col"><div class="head">G</div><div id="list-G" class="num-list"></div></div>
                <div class="col"><div class="head">O</div><div id="list-O" class="num-list"></div></div>
            </div>
        </div>
		<!-- WALLET -->
        <div id="wallet-screen" class="screen hidden">
            <h3>የኪስ ቦርሳ (Wallet)</h3>
            <p>💰 Main Wallet: <strong id="main-wallet-val">0.00</strong> ETB</p>
            <p>🎮 Play Wallet: <strong id="play-wallet-val">0.00</strong> ETB</p>
        </div>

        <!-- HISTORY -->
        <div id="history-screen" class="screen hidden">
            <h3>የጨዋታ ታሪክ</h3>
            <p style="color:#aaa;">ምንም መዝገብ የለም</p>
        </div>

        <!-- PROFILE -->
        <div id="profile-screen" class="screen hidden">
            <h3>መገለጫ (Profile)</h3>
            <p>👤 Telegram ID: <strong id="prof-tg-id">-</strong></p>
            <p>📞 ስልክ: <strong>0928361886</strong></p>
            <p>💰 Main Wallet: <strong id="prof-main-w">0.00</strong> ETB</p>
            <p>🎮 Play Wallet: <strong id="prof-play-w">0.00</strong> ETB</p>
        </div>
    </div>

    <!-- NAVIGATION BAR -->
    <div id="nav-bar">
        <button id="btn-game" class="nav-btn active" onclick="switchScreen('game')">🎮 Game</button>
        <button id="btn-wallet" class="nav-btn" onclick="switchScreen('wallet')">💰 Wallet</button>
        <button id="btn-history" class="nav-btn" onclick="switchScreen('history')">📜 History</button>
        <button id="btn-profile" class="nav-btn" onclick="switchScreen('profile')">👤 Profile</button>
    </div>

    <script>
        const API_BASE_URL = "http://localhost:8000/api"; 
        let selectedCartelas = [];
        let countdown = 49;
        let isGameStarted = false;
        let currentGameId = 1;
        let timerInterval = null;
        let callInterval = null;
        let tgId = 987654321; // ዴሞ መታወቂያ

        // የጌም አይዲ ፎርማት ማደሻ
        function updateGameIdDisplay() {
            let formattedId = String(currentGameId).padStart(4, '0');
            document.getElementById('game-id-display').innerText = "#" + formattedId;
        }

        // 1-600 ካርቴላ ግሪድ መፍጠሪያ
        const grid = document.getElementById('cartela-grid');
        for (let i = 1; i <= 600; i++) {
            let btn = document.createElement('button');
            btn.innerText = i;
            btn.classList.add('cartela-btn');
            btn.onclick = () => toggleCartela(i, btn);
            grid.appendChild(btn);
        }

        function toggleCartela(num, btn) {
            if (isGameStarted) return;
            if (selectedCartelas.includes(num)) {
                selectedCartelas = selectedCartelas.filter(n => n !== num);
                btn.classList.remove('selected');
            } else {
                if (selectedCartelas.length >= 3) { 
                    alert("ቢበዛ 3 ካርቴላ ብቻ ነው መምረጥ የሚችሉት!"); 
                    return; 
                }
                selectedCartelas.push(num);
                btn.classList.add('selected');
            }
        }

        function generateBingoMatrix(num) {
            let ranges = {
                'B': { min: 1, max: 15 },
                'I': { min: 16, max: 30 },
                'N': { min: 31, max: 45 },
                'G': { min: 46, max: 60 },
                'O': { min: 61, max: 75 }
            };
            let matrix = { 'B': [], 'I': [], 'N': [], 'G': [], 'O': [] };
            let seed = num;
            function rand() { let x = Math.sin(seed++) * 10000; return x - Math.floor(x); }

            for (let l in ranges) {
                let nums = [];
                for (let i = ranges[l].min; i <= ranges[l].max; i++) { nums.push(i); }
                for (let i = nums.length - 1; i > 0; i--) {
                    let j = Math.floor(rand() * (i + 1));
                    [nums[i], nums[j]] = [nums[j], nums[i]];
                }
                matrix[l] = nums.slice(0, 5);
            }
            return matrix;
        }

        function renderSelectedCards() {
		let container = document.getElementById('my-bingo-cards');
            container.innerHTML = "";
            selectedCartelas.forEach(num => {
                let matrix = generateBingoMatrix(num);
                let html = <div class="bingo-card-box">
                    <div style="font-weight:bold; color:#ffcc00; margin-bottom:5px;">ካርቴላ #${num}</div>
                    <div class="card-grid">
                        <div class="c-head">B</div><div class="c-head">I</div><div class="c-head">N</div><div class="c-head">G</div><div class="c-head">O</div>;
                for (let r = 0; r < 5; r++) {
                    ['B', 'I', 'N', 'G', 'O'].forEach(l => {
                        if (l === 'N' && r === 2) { html += <div class="cell marked" style="font-size:10px; padding:12px 0;">FREE</div>; }
                        else { let val = matrix[l][r]; html += <div class="cell" id="card-${num}-${l}-${val}">${val}</div>; }
                    });
                }
                html += </div></div>;
                container.innerHTML += html;
            });
        }

        function startTimer() {
            countdown = 49;
            document.getElementById('timer').innerText = countdown;
            timerInterval = setInterval(async () => {
                countdown--;
                document.getElementById('timer').innerText = countdown;
                if (countdown <= 0) { 
                    clearInterval(timerInterval); 
                    let paymentSuccess = await deductWalletForGame();
                    if (paymentSuccess) {
                        isGameStarted = true; 
                        startBingoCall(); 
                    } else {
                        alert("የሂሳብ ጉድለት ስላለ ጨዋታው አልተጀመረም!");
                        resetGameForNextRound();
                    }
                }
            }, 1000);
        }

        async def deductWalletForGame() {
            if (selectedCartelas.length === 0) return true;
            try {
                let response = await fetch(${API_BASE_URL}/buy-cartela, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
