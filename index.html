<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Bingo</title>
    <link rel="stylesheet" href="static/css/style.css">
    <script src="https://telegram.org"></script>
</head>
<body>
    <!-- Top Dashboard -->
    <div id="top-dashboard">
        <div>Stake: <span id="play-stake">10 ETB</span></div>
        <div>Main: <span id="main-wallet">500 ETB</span></div>
        <div>Play: <span id="play-wallet">50 ETB</span></div>
        <div id="timer-box">Timer: <span id="timer">49</span>s</div>
    </div>

    <!-- Main Screens -->
    <main id="main-content">
        <!-- 1. Selection Screen -->
        <section id="selection-screen">
            <h3>ካርቴላ ይምረጡ (ከ 1 - 3 ማርክ ማድረግ ይችላሉ)</h3>
            <div id="cards-container"><!-- JS 1-600 ካርቴላዎችን እዚህ ይፈጥራል --></div>
            <button id="confirm-selection-btn">ቀጥል</button>
        </section>

        <!-- 2. Active Game Screen (After Timer Ends) -->
        <section id="game-screen" class="hidden">
            <div id="game-id-header">Game ID: <span id="game-id">0001</span></div>
            
            <!-- Called Number Display -->
            <div id="called-number-screen">
                <span id="current-call">የሚጠራው ቁጥር...</span>
            </div>

            <!-- Bingo Board Columns -->
            <div class="bingo-board">
                <div class="column"><h3>B</h3><div id="col-B" class="num-list"></div></div>
                <div class="column"><h3>I</h3><div id="col-I" class="num-list"></div></div>
                <div class="column"><h3>N</h3><div id="col-N" class="num-list"></div></div>
                <div class="column"><h3>G</h3><div id="col-G" class="num-list"></div></div>
                <div class="column"><h3>O</h3><div id="col-O" class="num-list"></div></div>
            </div>

            <!-- User's Selected 5x5 Cards -->
            <div id="user-bingo-cards"></div>
        </section>

        <!-- Other Tabs -->
        <section id="wallet-screen" class="hidden"><h2>የኪስ ቦርሳ (Wallet)</h2></section>
        <section id="history-screen" class="hidden"><h2>የተጫወቱት ታሪክ (History)</h2></section>
        <section id="profile-screen" class="hidden">
            <h2>የእኔ መገለጫ (Profile)</h2>
            <p>Telegram ID: <span id="prof-tg-id">12345678</span></p>
            <p>Telephone: <span id="prof-phone">+2519...</span></p>
        </section>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="nav-bar">
        <button onclick="switchTab('game')">🎮 Game</button>
        <button onclick="switchTab('wallet')">💰 Wallet</button>
        <button onclick="switchTab('history')">📜 History</button>
        <button onclick="switchTab('profile')">👤 Profile</button>
    </nav>

    <script src="static/js/app.js"></script>
</body>
</html>
