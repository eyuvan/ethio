<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>እድል ቢንጎ (Lucky Bingo)</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #121212; color: #fff; text-align: center; user-select: none; }
        
        /* Ultra-Compact Top Bar (No Game ID) */
        #top-bar { 
            display: flex; 
            flex-wrap: wrap;
            justify-content: space-between; 
            align-items: center;
            background: #1e1e1e; 
            padding: 4px 10px; /* Minimized padding */
            font-size: 10px; /* Micro font size */
            font-weight: bold; 
            border-bottom: 1px solid #333; 
        }
        .top-row { display: flex; width: 100%; justify-content: space-between; margin-bottom: 2px; }
        .top-row:last-child { margin-bottom: 0; }
        .wallet-pill { background: #2a2a2a; padding: 1px 5px; border-radius: 3px; border: 1px solid #444; }
        #timer-box { background: #ff4444; padding: 1px 6px; border-radius: 10px; color: white; }

        #main-content { padding: 10px; padding-bottom: 80px; }
        .screen { display: block; }
        .hidden { display: none !important; }
        
        /* Micro 1-600 Grid Layout */
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(10, 1fr); 
            gap: 3px; 
            max-height: 260px; 
            overflow-y: auto; 
            background: #1a1a1a; 
            padding: 6px; 
            border-radius: 6px; 
            border: 1px solid #333;
        }
        .cartela-btn { 
            background: #2a2a2a; 
            color: white; 
            border: 1px solid #444; 
            padding: 4px 0; 
            font-size: 9px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 3px; 
        }
        .cartela-btn.selected { background: #ffcc00; color: black; box-shadow: 0 0 5px #ffcc00; }
        
        /* Bingo Screens */
        .bingo-card-box { background: #1e1e1e; border: 2px solid #ffcc00; border-radius: 8px; padding: 8px; margin-bottom: 12px; }
        .card-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
        .c-head { background: #ffcc00; color: black; font-weight: bold; padding: 4px 0; border-radius: 3px; font-size: 12px; }
        .cell { background: #2b2b2b; padding: 8px 0; font-weight: bold; border-radius: 3px; border: 1px solid #444; font-size: 12px; }
        .cell.marked { background: #4cd137; color: white; }
        #live-screen { background: #000; border: 2px solid #ffcc00; padding: 10px; font-size: 20px; font-weight: bold; color: #ffcc00; border-radius: 6px; margin-bottom: 12px; }
        
        .bingo-board { display: flex; justify-content: space-between; margin-top: 12px; }
        .col { width: 19%; background: #1e1e1e; border-radius: 4px; border: 1px solid #333; }
        .head { background: #333; color: #ffcc00; font-weight: bold; padding: 4px 0; font-size: 12px; }
        .num-list { font-size: 11px; padding: 6px 2px; min-height: 90px; color: #ccc; word-wrap: break-word; }
        
        /* Bottom Sticky Navigation */
        #nav-bar { position: fixed; bottom: 0; width: 100%; display: flex; background: #1e1e1e; border-top: 2px solid #333; z-index: 1000; }
        .nav-btn { flex: 1; background: transparent; color: #aaa; border: none; padding: 12px 0; font-size: 13px; font-weight: bold; cursor: pointer; }
        .nav-btn.active { color: #ffcc00; border-top: 3px solid #ffcc00; padding-top: 9px; }
    </style>
</head>
<body>

    <!-- ULTRA-COMPACT TOP BAR (NO GAME ID) -->
    <div id="top-bar">
           
            <div class="wallet-pill">Main walet: <span id="top-main-wallet" style="color:#4cd137;">0.00</span></div>
            <div class="wallet-pill">Play walet: <span id="top-play-wallet" style="color:#ffcc00;">0.00</span></div>
            <div>Stake: <span style="color:#ffcc00;">10 ETB</span></div>
			<div id="timer-box">Timer: <span id="timer">49</span>s</div>
    </div>

    <!-- MAIN APP SCREENS CONTAINER -->
    <div id="main-content">
        <!-- Game Section Wrapper -->
        <div id="game-screen-wrapper" class="screen">
            <div id="selection-screen">
                <div id="cartela-grid" class="grid-container"></div>
            </div>
            <div id="game-screen" class="hidden">
                <div id="live-screen">የተጠራ ቁጥር: <span id="called-number">-</span></div>
                <div id="my-bingo-cards"></div>
                <div class="bingo-board">
                    <div class="col"><div class="head">B</div><div id="list-B" class="num-list"></div></div>
                    <div class="col"><div class="head">I</div><div id="list-I" class="num-list"></div></div>
                    <div class="col"><div class="head">N</div><div id="list-N" class="num-list"></div></div>
                    <div class="col"><div class="head">G</div><div id="list-G" class="num-list"></div></div>
                    <div class="col"><div class="head">O</div><div id="list-O" class="num-list"></div></div>
                </div>
            </div>
        </div>

        <!-- Wallet Screen View -->
        <div id="wallet-screen" class="screen hidden">
            <h3>የኪስ ቦርሳ (Wallet)</h3>
            <p>💰 Main Wallet (የማሸነፊያ ብር): <strong id="main-wallet-val">0.00</strong> ETB</p>
            <p>🎮 Play Wallet (የመጫወቻ ብር): <strong id="play-wallet-val">0.00</strong> ETB</p>
        </div>

        <!-- History Screen View -->
        <div id="history-screen" class="screen hidden">
            <h3>የጨዋታ ታሪክ</h3>
            <div id="history-list" style="color:#aaa;">ምንም መዝገብ የለም</div>
        </div>

        <!-- Profile Screen View -->
        <div id="profile-screen" class="screen hidden">
            <h3>መገለጫ (Profile)</h3>
            <p>👤 Telegram ID: <strong id="prof-tg-id">-</strong></p>
            <p>📞 ስልክ: <strong>0928361886</strong></p>
            <p>💰 Main Wallet: <strong id="prof-main-w">0.00</strong> ETB</p>
            <p>🎮 Play Wallet: <strong id="prof-play-w">0.00</strong> ETB</p>
        </div>
    </div>

    <!-- NAVIGATION BAR -->
    <div id="nav-bar">
        <button id="btn-game" class="nav-btn active" onclick="switchScreen('game')">🎮 Game</button>
        <button id="btn-wallet" class="nav-btn" onclick="switchScreen('wallet')">💰 Wallet</button>
        <button id="btn-history" class="nav-btn" onclick="switchScreen('history')">📜 History</button>
        <button id="btn-profile" class="nav-btn" onclick="switchScreen('profile')">👤 Profile</button>
    </div>

    <script>
        const API_BASE_URL = "http://localhost:8000/api"; 
        let selectedCartelas = [];
        let countdown = 49;
        let isGameStarted = false;
        let timerInterval = null;
        let callInterval = null;
        let tgId = 987654321; 
        let calledNumbersLog = [];

        // Initialize grid selection elements
        const grid = document.getElementById('cartela-grid');
        for (let i = 1; i <= 600; i++) {
            let btn = document.createElement('button');
            btn.innerText = i;
            btn.classList.add('cartela-btn');
            btn.onclick = () => toggleCartela(i, btn);
            grid.appendChild(btn);
        }

        function toggleCartela(num, btn) {
            if (isGameStarted) return;
            if (selectedCartelas.includes(num)) {
                selectedCartelas = selectedCartelas.filter(n => n !== num);
				btn.classList.remove('selected');
            } else {
                if (selectedCartelas.length >= 3) { 
                    alert("ቢበዛ 3 ካርቴላ ብቻ ነው መምረጥ የሚችሉት!"); 
                    return; 
                }
                selectedCartelas.push(num);
                btn.classList.add('selected');
            }
        }

        function generateBingoMatrix(num) {
            let ranges = {
                'B': { min: 1, max: 15 },
                'I': { min: 16, max: 30 },
                'N': { min: 31, max: 45 },
                'G': { min: 46, max: 60 },
                'O': { min: 61, max: 75 }
            };
            let matrix = { 'B': [], 'I': [], 'N': [], 'G': [], 'O': [] };
            let seed = num;
            function rand() { let x = Math.sin(seed++) * 10000; return x - Math.floor(x); }

            for (let l in ranges) {
                let nums = [];
                for (let i = ranges[l].min; i <= ranges[l].max; i++) { nums.push(i); }
                for (let i = nums.length - 1; i > 0; i--) {
                    let j = Math.floor(rand() * (i + 1));
                    [nums[i], nums[j]] = [nums[j], nums[i]];
                }
                matrix[l] = nums.slice(0, 5);
            }
            return matrix;
        }

        function renderSelectedCards() {
            let container = document.getElementById('my-bingo-cards');
            container.innerHTML = "";
            selectedCartelas.forEach(num => {
                let matrix = generateBingoMatrix(num);
                let html = <div class="bingo-card-box">
                    <div style="font-weight:bold; color:#ffcc00; margin-bottom:5px;">ካርቴላ #${num}</div>
                    <div class="card-grid">
                        <div class="c-head">B</div><div class="c-head">I</div><div class="c-head">N</div><div class="c-head">G</div><div class="c-head">O</div>;
                for (let r = 0; r < 5; r++) {
                    ['B', 'I', 'N', 'G', 'O'].forEach(l => {
                        if (l === 'N' && r === 2) { html += <div class="cell marked" style="font-size:10px; padding:12px 0;">FREE</div>; }
