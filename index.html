<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edil Bingo</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; margin: 0; padding: 0; text-align: center; }
        .hidden { display: none !important; }
        
        /* 1ኛው ገጽ፡ የመምረጫ ገጽ */
        .top-bar { display: flex; justify-content: space-around; background: #222; padding: 10px; font-size: 14px; }
        .timer { color: #ff4757; font-weight: bold; }
        .cartela-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; height: 250px; overflow-y: scroll; padding: 10px; background: #1a1a1a; }
        .cartela { background: #333; padding: 12px; border-radius: 4px; cursor: pointer; }
        .cartela.selected { background: #2ed573; color: black; font-weight: bold; }
        
        /* 2ኛው ገጽ፡ የቢንጎ መጫወቻ የቀጥታ ገጽ */
        .live-game-page { padding: 15px; }
        .live-top-bar { display: flex; justify-content: space-between; background: #2ed573; color: black; padding: 12px; font-weight: bold; border-radius: 8px; font-size: 14px; margin-bottom: 15px; }
        
        .live-screen-container { margin: 20px 0; }
        .small-live-screen { width: 110px; height: 110px; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; box-shadow: 0 0 15px rgba(255,255,255,0.2); transition: background 0.3s ease; }
        
        .bingo-board { display: flex; justify-content: space-around; background: #1a1a1a; padding: 10px; border-radius: 8px; }
        .column { width: 18%; }
        .column h3 { margin: 5px 0; font-size: 20px; color: #ffa502; border-bottom: 2px solid #ffa502; }
        .column div { display: flex; flex-direction: column; gap: 4px; }
        .column div span { background: #2d3436; padding: 6px; font-size: 14px; border-radius: 3px; color: #b2bec3; }
        
        .column div span.called-highlight { background: #2ed573; color: black; font-weight: bold; transform: scale(1.05); box-shadow: 0 0 8px #2ed573; }
    </style>
</head>
<body>

    <!-- ================= 1ኛው ገጽ፡ የመምረጫ ስክሪን ================= -->
    <div id="selection-page">
        <div class="top-bar">
            <div>Stake: <span>10 ETB</span></div>
            <div>Main Wallet: <span>150</span></div>
            <div>Play Wallet: <span>50</span></div>
            <div class="timer">Timer: <span id="countdown">49</span>s</div>
        </div>
        <h2>ካርቴላ ይምረጡ (1 - 600)</h2>
        <div class="cartela-grid" id="grid-container"></div>
    </div>

    <!-- ================= 2ኛው ገጽ፡ የቀጥታ ጨዋታ ስክሪን ================= -->
    <div id="live-game-page" class="live-game-page hidden">
        <div class="live-top-bar">
            <div>Game ID: <span id="lbl-game-id">0000</span></div>
            <div>Bet: <span id="lbl-bet">-</span></div>
            <div>ደራሽ: <span id="lbl-derash">-</span></div>
            <div>Called: <span id="lbl-called-count">0</span></div>
        </div>

        <div class="live-screen-container">
            <div id="live-ball-screen" class="small-live-screen" style="background-color: #ff4757;">-</div>
        </div>

        <div class="bingo-board">
            <div class="column"><h3>B</h3><div id="list-B"></div></div>
            <div class="column"><h3>I</h3><div id="list-I"></div></div>
            <div class="column"><h3>N</h3><div id="list-N"></div></div>
            <div class="column"><h3>G</h3><div id="list-G"></div></div>
            <div class="column"><h3>O</h3><div id="list-O"></div></div>
        </div>
    </div>

    <script>
        // --- 1. የካርቴላ መምረጫ አወቃቀር (1-600) ---
        const grid = document.getElementById('grid-container');
		for (let i = 1; i <= 600; i++) {
            let div = document.createElement('div');
            div.className = 'cartela';
            div.innerText = i;
            div.onclick = function() {
                document.querySelectorAll('.cartela').forEach(c => c.classList.remove('selected'));
                div.classList.add('selected');
            };
            grid.appendChild(div);
        }

        // --- 2. የቢንጎ ቦርድ ቁጥሮች ዝርዝር ማውጫ (1-75) ---
        function createBingoBoard() {
            for(let i=1; i<=15; i++) { document.getElementById('list-B').innerHTML += '<span id="cell-' + i + '">' + i + '</span>'; }
            for(let i=16; i<=30; i++) { document.getElementById('list-I').innerHTML += '<span id="cell-' + i + '">' + i + '</span>'; }
            for(let i=31; i<=45; i++) { document.getElementById('list-N').innerHTML += '<span id="cell-' + i + '">' + i + '</span>'; }
            for(let i=46; i<=60; i++) { document.getElementById('list-G').innerHTML += '<span id="cell-' + i + '">' + i + '</span>'; }
            for(let i=61; i<=75; i++) { document.getElementById('list-O').innerHTML += '<span id="cell-' + i + '">' + i + '</span>'; }
        }
        createBingoBoard();

        // --- 3. ለትንሹ ስክሪን የዘፈቀደ ቀለማት ---
        const ballColors = ["#ff4757", "#2ed573", "#1e90ff", "#ffa502", "#9b59b6", "#00d2d3", "#ff6b81"];

        // --- 4. የካውንትዳውን ሰዓት ቆጣሪ ሎጂክ ---
        let timer = 49;
        const countdownElement = document.getElementById('countdown');
        
        const clock = setInterval(function() {
            timer--;
            countdownElement.innerText = timer;
            if (timer <= 0) {
                clearInterval(clock);
                document.getElementById('selection-page').classList.add('hidden');
                document.getElementById('live-game-page').classList.remove('hidden');
                
                connectToBingoWebSocket();
            }
        }, 1000);

        // --- 5. የዌብሶኬት ግንኙነት (ሙሉ በሙሉ የጸዳ የJS ሰዋስው) ---
        function connectToBingoWebSocket() {
            const ws = new WebSocket("ws://localhost:8000/ws/game");
            
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                
                if (data.type === "LIVE_DRAW") {
                    document.getElementById('lbl-game-id').innerText = data.game_id;
                    document.getElementById('lbl-bet').innerText = data.bet;
                    document.getElementById('lbl-derash').innerText = data.derash;
                    document.getElementById('lbl-called-count').innerText = data.called_count;
                    
                    const ballScreen = document.getElementById('live-ball-screen');
                    ballScreen.innerText = data.current_call;
                    const randomColor = ballColors[Math.floor(Math.random() * ballColors.length)];
                    ballScreen.style.backgroundColor = randomColor;
                    
                    if (data.history) {
                        data.history.forEach(function(item) {
                            let cell = document.getElementById('cell-' + item.number);
                            if (cell) cell.classList.add('called-highlight');
                        });
                    }
                }
                
                if (data.type === "GAME_OVER") {
                    document.getElementById('live-ball-screen').innerText = "END";
                    document.getElementById('live-ball-screen').style.backgroundColor = "#333";
                }
            };
        }
    </script>
</body>
</html>
